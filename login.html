<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <title> CSS Login Screen Tutorial </title>
</head>
<body>
    
    <nav class="navbar">
        <div class="logo-container">
            <a href="index.html"><img src="logo.jpg.png" alt="THE READERS CHOICE Logo" class="logo-img"></a>
        </div>
        <div class="nav-right">
            <li><a href="index.html">Home</a></li>
            <li><a href="products.html">Products</a></li>
            <li><a href="About.html">About</a></li>
            <li><a href="new_arrival.html">New Arrival</a></li>
            <li><a href="login.html">Login</a></li>
            <li><a href="Register.html">Create Account</a></li>
        </div>
    </nav>

    <div class="login-page">
      <div class="form">
        <div class="login">
          <div class="login-header">
            <h3>LOGIN</h3>
            <p>Please enter your credentials to login.</p>
          </div>
        </div>
        <!-- आपला लॉगिन फॉर्म -->
        <form class="login-form">
          <input type="email" id="username" placeholder="Email" required />
          <div class="password-box">
          <input type="password" id="password" placeholder="Password" required />
          <i class="fa-solid fa-eye" id="togglePassword"></i>
          </div>
          <button type="submit">Login</button>
          <p class="message">Not registered? <a href="Register.html">Create an account</a></p>
        </form>
      </div>
    </div>

   
    <script>

    const password = document.getElementById("password");
const togglePassword = document.getElementById("togglePassword");

togglePassword.addEventListener("click", () => {

    if(password.type === "password"){
        password.type = "text";
        togglePassword.classList.remove("fa-eye");
        togglePassword.classList.add("fa-eye-slash");
    }
    else{
        password.type = "password";
        togglePassword.classList.remove("fa-eye-slash");
        togglePassword.classList.add("fa-eye");
    }

});

    const loginForm = document.querySelector('.login-form');

    if (loginForm) {
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault(); // पेज आपोआप रिफ्रेश होऊ नये म्हणून

            // आयडीवरून अचूक व्हॅल्यू मिळवणे
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();

            // बॅकएंड ईमेल मागतो, म्हणून युझरनेमला ईमेल फॉरमॅटमध्ये बदलणे
            const email = username.includes('@') ? username : `${username}@gmail.com`;

            try {
                // एक्सप्रेस बॅकएंडच्या Login API ला कॉल करणे
                const response = await fetch('https://ebook-website-readers-choice.onrender.com/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                // जर बॅकएंडने सांगितलं की लॉगिन यशस्वी झालं आहे:
                if (data.success) {
                    alert("🔓 Login successful! You are now connected! 🎉");
                    
                    // युझरचा डेटा ब्राउझरच्या मेमरीमध्ये सेव्ह करणे
                    localStorage.setItem('user', JSON.stringify(data.user));
                    
                    // लॉगिन झाल्यावर थेट मुख्य होम पेजवर जाणे
                   window.location.href = 'index.html';
                } else {
                    // पासवर्ड किंवा युझरनेम चुकीचा असेल तर
                    alert("❌ Login failed: " + data.message);
                }
            } catch (error) {
                console.error("Connection Error:", error);
                alert("😥 Could not connect to the server. Please check that your Node.js server is running.");
            }
        });
    }
    </script>
</body>
</html>
