<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="login.css">
<title> CSS Login Screen Tutorial </title>
</head>
<body>
  <body>
    
    <nav class="navbar">
      <div class="logo-container">
          <a href="index.html"><img src="logo.jpg.png" alt="THE READERS CHOICE Logo" class="logo-img"></a>
      </div>
      <div class="nav-right">
          <li><a href="index.html">Home</a></li>
          <li><a href="products.html">Products</a></li>
          <li><a href="About.html">About</a></li>
          <li><a href="new_arrival.html">New Arrival</a></li>
          <li><a href="login.html">Login</a></li>
          <li><a href="Register.html">Create Account</a></li>
      </div>
  </nav>
    <div class="login-page">
      <div class="form">
        <div class="login">
          <div class="login-header">
            <h3>REGISTER</h3>
            <p>Please enter your credentials to login.</p>
          </div>
        </div>
        <form class="login-form">
          <input type="text" id="username" placeholder="username" pattern="[A-Za-z0-9]{1,6}"  required/>
          <input type="email" id="email" placeholder="Email" required />
          <input type="password" id="password" placeholder="password" required />
  
          <!-- बदल: इथून <a> टॅग काढून फक्त साधा type="submit" असलेला बटन ठेवला आहे -->
          <button type="submit">Register</button>
  
          <p class="message">Already registered? <a href="login.html">Login</a></p>
        </form>
      </div>
    </div>

    
<script>  
    

// तुमच्या फॉर्मला सिलेक्ट करणे (इथे आपण फॉर्म शोधत आहोत)

const signupForm = document.querySelector('.login-form');

if (signupForm) {
    signupForm.addEventListener('submit', async (e) => {
        e.preventDefault(); // पेज रिफ्रेश किंवा रीडायरेक्ट होण्यापासून रोखण्यासाठी

        // आयडीवरून अचूक व्हॅल्यू मिळवणे
        const username = document.getElementById('username').value.trim();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value.trim();

        try {
            // बॅकएंड API ला कॉल करणे
            const response = await fetch('http://localhost:5000/api/auth/register', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ username, email, password })
            });

            const data = await response.json();

            if (data.success) {
                alert("🎉 अभिनंदन! नवीन युझर डेटाबेसमध्ये यशस्वीरित्या रजिस्टर झाला आहे!");
                signupForm.reset(); // फॉर्ममधील सगळी माहिती साफ करण्यासाठी
                
                // यशस्वी रजिस्टर झाल्यावर युझरला लॉगिन पेजवर पाठवण्यासाठी:
                window.location.href = 'file:///C:/Users/Tanuja%20Patil/OneDrive/Desktop/tanuja%20patil/tanuja/login.html';
            } else {
                alert("❌ त्रुटी: " + data.message);
            }
        } catch (error) {
            console.error("कनेक्शन एरर:", error);
            alert("😥 सर्व्हरशी जोडणी होऊ शकली नाही. तुमचा Node.js सर्व्हर चालू आहे ना हे तपासा.");

        }
    });
}

</script>

</body>
</body>
</html>
