        <div class="payment-options">

<script>
    let cart = JSON.parse(localStorage.getItem('bookCart')) || [];
    let myPurchasedBooks = JSON.parse(localStorage.getItem('myPurchasedBooks')) || [];

    function getLoggedInUser() {
        return localStorage.getItem('loggedInUser') || localStorage.getItem('user');
    }

    function renderCart() {
        const cartList = document.getElementById('cart-items-list');
        const totalPriceElement = document.getElementById('total-price');
        const cartCountElement = document.getElementById('cart-count');
        
        if (cartCountElement) cartCountElement.innerText = cart.length;
        if (!cartList || !totalPriceElement) return;

        cartList.innerHTML = '';
        let total = 0;

        if (cart.length === 0) {
            cartList.innerHTML = '<p class="empty-msg">तुमचे कार्ट रिकामे आहे!</p>';
            totalPriceElement.innerText = '0';
        } else {
            cart.forEach((item, index) => {
                const itemPrice = parseInt(item.price) || 0;
                total += itemPrice;

                const itemElement = document.createElement('div');
                itemElement.className = 'cart-item';
                const itemImg = item.image || 'img1.jpg';

                itemElement.innerHTML = `
                    <div class="cart-item-info">
                        <img src="${itemImg}" alt="${item.title}" class="cart-item-img" onerror="this.src='img1.jpg';">
                        <div>
                            <div class="item-title">${item.title || 'Book'}</div>
                            <p style="margin: 3px 0; color: #555;">Price: ₹${itemPrice}</p>
                        </div>
                    </div>
                    <button class="remove-btn" onclick="removeFromCart(${index})">Remove</button>
                `;
                cartList.appendChild(itemElement);
            });

            totalPriceElement.innerText = total;
        }

        renderPurchasedBooks();
    }

    function renderPurchasedBooks() {
    const purchasedList = document.getElementById('purchased-books-list');
    if (!purchasedList) return;
    
    purchasedList.innerHTML = '';
    const userEmail = getLoggedInUser(); // ✅ सध्याच्या युझरचा Email ID

    if (!userEmail) {
        purchasedList.innerHTML = `
            <div style="text-align: center; padding: 15px;">
                <p style="color: #e74c3c; font-weight: bold; margin-bottom: 10px;">
                    🔒 तुमची खरेदी केलेली पुस्तके पाहण्यासाठी व डाउनलोड करण्यासाठी आधी Login करा.
                </p>
                <a href="login.html" class="login-prompt-btn">Login Now 🔑</a>
            </div>
        `;
        return;
    }

    // ✅ Email ID मॅच करून फिल्टर करा
    const userPurchasedBooks = myPurchasedBooks.filter(book => book.purchasedBy === userEmail);

    if (userPurchasedBooks.length === 0) {
        purchasedList.innerHTML = '<p class="empty-msg">तुम्ही अजून एकही पुस्तक खरेदी केलेले नाही.</p>';
        return;
    }

    userPurchasedBooks.forEach(book => {
        const pdfUrl = book.pdf;
        const bookItem = document.createElement('div');
        bookItem.className = 'purchased-item';
        
        bookItem.innerHTML = `
            <div>
                <strong style="font-size: 16px; color: #333;">${book.title || 'Book'}</strong>
                <div style="font-size: 12px; color: #777;">Purchased Date: ${book.date || 'Recently'}</div>
            </div>
            <div class="action-btns">
                <a href="${pdfUrl}" target="_blank" class="btn-read">📖 Read</a>
                <a href="${pdfUrl}" download="${book.title || 'Book'}.pdf" class="btn-download">⬇️ Download</a>
            </div>
        `;
        purchasedList.appendChild(bookItem);
    });
}

    function removeFromCart(index) {
        cart.splice(index, 1);
        localStorage.setItem('bookCart', JSON.stringify(cart));
        renderCart();
    }

    function openPaymentModal() {
        if (cart.length === 0) {
            alert('तुमचे कार्ट रिकामे आहे!');
            return;
        }

        const user = getLoggedInUser();
        if (!user) {
            alert('⚠️ Checkout करण्यासाठी आणि पुस्तके डाउनलोड करण्यासाठी आधी Login करा!');
            window.location.href = 'login.html';
            return;
        }

        const total = cart.reduce((sum, item) => sum + (parseInt(item.price) || 0), 0);
        document.getElementById('modal-total').innerText = total;
        document.getElementById('paymentModal').style.display = 'flex';
    }

    function closePaymentModal() {
        document.getElementById('paymentModal').style.display = 'none';
    }

    function processFakePayment() {
    const selectedOption = document.querySelector('input[name="payMethod"]:checked').value;
    const total = document.getElementById('modal-total').innerText;
    
    // ✅ लॉगिन असलेल्या युझरचा Email ID घ्या
    const currentUserEmail = getLoggedInUser(); 

    alert(`⏳ Processing Payment via ${selectedOption}...`);

    setTimeout(() => {
        alert(`🎉 Success! ₹${total} चे पेमेंट यशस्वी झाले! पुस्तक तुमच्या 'My Purchased Books' सेक्शन मध्ये ॲड झाले आहे.`);

        const today = new Date().toLocaleDateString();

        cart.forEach(item => {
            myPurchasedBooks.push({
                ...item,
                date: today,
                purchasedBy: currentUserEmail // ✅ ईमेल आयडी सेव्ह केला
            });
        });

        localStorage.setItem('myPurchasedBooks', JSON.stringify(myPurchasedBooks));
        localStorage.removeItem('bookCart');
        cart = [];

        closePaymentModal();
        renderCart();

    }, 1200);
}

    renderCart();
